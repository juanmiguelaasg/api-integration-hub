name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (no GUI needed)
        run: pip install -r requirements-headless.txt pytest

      - name: Run tests
        run: python -m pytest -q

  demo-report:
    name: Demo sync + Excel report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-headless.txt

      - name: Start the demo systems
        run: |
          python mock_systems.py --port 8100 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8100/crm/health && break; sleep 0.5; done

      - name: Health-check, sync and export
        run: |
          python -m integrationhub check
          python -m integrationhub demo-seed
          python -m integrationhub run --all
          python -m integrationhub run --all
          python -m integrationhub export -o exports/integration-hub-report.xlsx

      - uses: actions/upload-artifact@v4
        with:
          name: integration-hub-report
          path: exports/integration-hub-report.xlsx
